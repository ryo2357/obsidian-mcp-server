[package]
name = "obsidian-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
chrono = "0.4.41"
clap = { version = "4.5.42", features = ["derive"] }
dirs = "6.0.0"
flexi_logger = "0.31.2"
log = "0.4.27"
once_cell = "1.21.3"
rmcp = { version = "0.5.0", features = ["server", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.47.0", features = ["full"] }
toml = "0.9.4"

[dev-dependencies]
tempfile = "3.0"
